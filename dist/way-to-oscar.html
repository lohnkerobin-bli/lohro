/* ============================================================
   WAY TO OSCAR — Command Center
   Cinematic dark design system
   ============================================================ */

:root {
  --true-black: #0A0A0A;
  --black-raise: #121212;
  --black-panel: #161618;
  --black-card: #1C1C1F;
  --black-line: #2A2A2E;
  --set-red: #E63946;
  --set-red-dim: #B02A35;
  --stage-teal: #2A9D8F;
  --stage-blue: #457B9D;
  --cream: #F1FAEE;
  --cream-dim: #C9CFC6;
  --cream-faint: #8F958D;
  --gold: #D4AF37;

  --font-display: "Futura", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 4px 24px rgba(0,0,0,.55);
  --pad: clamp(14px, 3vw, 28px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scrollbar-color: var(--black-line) var(--true-black); }

body {
  background: var(--true-black);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* subtle film-grain / vignette backdrop */
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 120% 90% at 50% -10%, rgba(69,123,157,.10), transparent 55%),
    radial-gradient(ellipse 100% 80% at 90% 110%, rgba(230,57,70,.06), transparent 55%);
  z-index: 0;
}

#app-shell { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

/* ---------- Top bar ---------- */
#topbar {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding: 14px var(--pad);
  border-bottom: 1px solid var(--black-line);
  background: rgba(10,10,10,.85);
  backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 50;
}
.brand { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
.brand-mark {
  width: 42px; height: 42px; display: grid; place-items: center;
  font-size: 22px;
  background: linear-gradient(145deg, var(--black-card), var(--black-raise));
  border: 1px solid var(--gold);
  border-radius: 8px;
  box-shadow: 0 0 18px rgba(212,175,55,.15);
}
.brand-text { display: flex; flex-direction: column; }
.brand-title {
  font-family: var(--font-display);
  font-weight: 800; font-size: 17px; letter-spacing: .18em;
}
.brand-sub { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--cream-faint); }

#main-nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
#main-nav a {
  color: var(--cream-dim); text-decoration: none;
  font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  padding: 8px 13px; border-radius: 7px;
  border: 1px solid transparent;
  transition: color .15s, background .15s;
  white-space: nowrap;
}
#main-nav a:hover { color: var(--cream); background: var(--black-panel); }
#main-nav a.active {
  color: var(--cream);
  background: linear-gradient(145deg, rgba(230,57,70,.18), rgba(230,57,70,.08));
  border-color: rgba(230,57,70,.45);
}

/* ---------- Main / footer ---------- */
#view { flex: 1; padding: calc(var(--pad) * 1.1) var(--pad) 60px; max-width: 1280px; width: 100%; margin: 0 auto; }
#footer {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px var(--pad);
  border-top: 1px solid var(--black-line);
  color: var(--cream-faint); font-size: 12px; letter-spacing: .04em;
}

/* ---------- Typography ---------- */
h1.view-title {
  font-family: var(--font-display);
  font-size: clamp(24px, 4vw, 34px);
  font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  margin-bottom: 4px;
}
.view-sub { color: var(--cream-faint); font-size: 13.5px; margin-bottom: 26px; }
h2.section-title {
  font-family: var(--font-display);
  font-size: 14px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  color: var(--cream-dim);
  display: flex; align-items: center; gap: 10px;
  margin: 30px 0 14px;
}
h2.section-title::after { content: ""; flex: 1; height: 1px; background: var(--black-line); }

/* ---------- Cards / grid ---------- */
.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

.card {
  background: linear-gradient(160deg, var(--black-card), var(--black-panel));
  border: 1px solid var(--black-line);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow);
}
.card.accent-red { border-top: 2px solid var(--set-red); }
.card.accent-teal { border-top: 2px solid var(--stage-teal); }
.card.accent-blue { border-top: 2px solid var(--stage-blue); }
.card.accent-gold { border-top: 2px solid var(--gold); }

.stat-label { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--cream-faint); }
.stat-value { font-family: var(--font-display); font-size: clamp(26px, 3.4vw, 40px); font-weight: 800; line-height: 1.15; margin: 4px 0 2px; }
.stat-hint { font-size: 12px; color: var(--cream-faint); }
.stat-value .unit { font-size: .45em; color: var(--cream-dim); font-weight: 600; letter-spacing: .06em; }

/* ---------- Buttons / inputs ---------- */
button, .btn {
  font-family: var(--font-body);
  font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--cream);
  background: var(--black-card);
  border: 1px solid var(--black-line);
  border-radius: var(--radius-sm);
  padding: 9px 15px;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .05s;
}
button:hover, .btn:hover { border-color: var(--cream-faint); }
button:active { transform: translateY(1px); }
button.primary { background: var(--set-red); border-color: var(--set-red); }
button.primary:hover { background: var(--set-red-dim); }
button.teal { background: var(--stage-teal); border-color: var(--stage-teal); color: #06211E; }
button.blue { background: var(--stage-blue); border-color: var(--stage-blue); }
button.ghost { background: transparent; }
button.small { padding: 5px 10px; font-size: 11px; }
button.danger:hover { border-color: var(--set-red); color: var(--set-red); }

input, select, textarea {
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--cream);
  background: var(--black-raise);
  border: 1px solid var(--black-line);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  width: 100%;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--stage-blue); }
textarea { resize: vertical; min-height: 70px; }
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--cream-faint); margin-bottom: 5px; }

/* ---------- Badges / chips ---------- */
.badge {
  display: inline-block;
  font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 99px;
  border: 1px solid var(--black-line);
  color: var(--cream-dim);
  background: var(--black-raise);
  white-space: nowrap;
}
.badge.red   { color: #FF8B94; border-color: rgba(230,57,70,.5);  background: rgba(230,57,70,.12); }
.badge.teal  { color: #7EDCD2; border-color: rgba(42,157,143,.5); background: rgba(42,157,143,.12); }
.badge.blue  { color: #9DC6E0; border-color: rgba(69,123,157,.55);background: rgba(69,123,157,.14); }
.badge.gold  { color: #EBD489; border-color: rgba(212,175,55,.5); background: rgba(212,175,55,.10); }
.badge.gray  { color: var(--cream-faint); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--black-line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--black-line); vertical-align: top; }
th {
  font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--cream-faint);
  background: var(--black-raise); position: sticky; top: 0;
}
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,.025); }

/* ---------- Progress bars ---------- */
.progress {
  height: 8px; border-radius: 99px; background: var(--black-raise);
  border: 1px solid var(--black-line); overflow: hidden;
}
.progress > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--stage-teal), var(--stage-blue)); transition: width .4s ease; }
.progress.red > div { background: linear-gradient(90deg, var(--set-red-dim), var(--set-red)); }
.progress.gold > div { background: linear-gradient(90deg, #A8842A, var(--gold)); }

/* ---------- Countdown ---------- */
.countdown { display: flex; gap: 14px; flex-wrap: wrap; }
.countdown .unit-box {
  flex: 1; min-width: 70px;
  text-align: center;
  background: var(--black-raise);
  border: 1px solid var(--black-line);
  border-radius: var(--radius-sm);
  padding: 12px 6px;
}
.countdown .num { font-family: var(--font-display); font-size: clamp(24px, 3vw, 36px); font-weight: 800; color: var(--gold); }
.countdown .lbl { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--cream-faint); }

/* ---------- Challenge day grid ---------- */
.day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.day-cell {
  border: 1px solid var(--black-line);
  border-radius: var(--radius-sm);
  background: var(--black-panel);
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color .15s, transform .1s;
  min-height: 86px;
  display: flex; flex-direction: column; gap: 4px;
}
.day-cell:hover { border-color: var(--cream-faint); transform: translateY(-1px); }
.day-cell .d-date { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--cream-faint); display: flex; justify-content: space-between; }
.day-cell .d-title { font-size: 13px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.day-cell.today { border-color: var(--gold); box-shadow: 0 0 14px rgba(212,175,55,.14); }
.day-cell.published { border-left: 3px solid var(--stage-teal); }
.day-cell.editing, .day-cell.shooting { border-left: 3px solid var(--stage-blue); }
.day-cell.planned { border-left: 3px solid var(--cream-faint); }
.day-cell.skipped { opacity: .45; border-left: 3px solid var(--set-red-dim); }
.day-cell.future { opacity: .6; border-style: dashed; }
.day-cell.empty .d-title { color: var(--cream-faint); font-style: italic; font-weight: 400; }

/* ---------- Timeline (festival roadmap) ---------- */
.timeline { position: relative; margin-left: 10px; padding-left: 26px; border-left: 2px solid var(--black-line); }
.timeline-item { position: relative; padding: 0 0 22px; }
.timeline-item::before {
  content: ""; position: absolute; left: -33px; top: 5px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--stage-blue); border: 2px solid var(--true-black);
}
.timeline-item.past::before { background: var(--black-line); }
.timeline-item.urgent::before { background: var(--set-red); box-shadow: 0 0 10px rgba(230,57,70,.6); }
.timeline-item .tl-date { font-family: var(--font-mono); font-size: 12px; color: var(--gold); letter-spacing: .04em; }
.timeline-item.past .tl-date { color: var(--cream-faint); }
.timeline-item .tl-title { font-weight: 700; font-size: 14.5px; margin: 2px 0; }
.timeline-item .tl-meta { font-size: 12.5px; color: var(--cream-faint); }

/* ---------- Modal ---------- */
#modal-root:empty { display: none; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(3px);
  display: grid; place-items: center;
  padding: 18px;
  animation: fadeIn .15s ease;
}
.modal {
  background: var(--black-panel);
  border: 1px solid var(--black-line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  width: 100%; max-width: 560px;
  max-height: 88vh; overflow-y: auto;
  padding: 24px;
  animation: rise .18s ease;
}
.modal h3 { font-family: var(--font-display); letter-spacing: .1em; text-transform: uppercase; font-size: 16px; margin-bottom: 16px; }
.modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }

/* ---------- Toast ---------- */
#toast-root { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--black-card); border: 1px solid var(--stage-teal);
  color: var(--cream); border-radius: 8px; padding: 10px 18px;
  font-size: 13px; box-shadow: var(--shadow);
  animation: rise .2s ease;
}
.toast.error { border-color: var(--set-red); }

/* ---------- Misc ---------- */
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.muted { color: var(--cream-faint); }
.mono { font-family: var(--font-mono); }
.mt { margin-top: 14px; } .mb { margin-bottom: 14px; }
.clickable { cursor: pointer; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.filter-bar select, .filter-bar input { width: auto; min-width: 130px; }
.empty-note { color: var(--cream-faint); font-style: italic; padding: 18px 4px; }
a { color: var(--stage-blue); }
a:hover { color: var(--cream); }

.milestone-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--black-line); }
.milestone-row:last-child { border-bottom: none; }
.milestone-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--stage-teal); flex-shrink: 0; }
.milestone-row.done .m-title { text-decoration: line-through; color: var(--cream-faint); }
.milestone-row .m-title { flex: 1; font-size: 14px; }
.milestone-row .m-date { font-family: var(--font-mono); font-size: 12px; color: var(--cream-faint); white-space: nowrap; }

/* sparkline chart */
.chart-box svg { width: 100%; height: auto; display: block; }

/* ---------- Mobile ---------- */
@media (max-width: 720px) {
  #topbar { padding: 10px 12px; gap: 10px; }
  .brand-sub { display: none; }
  #main-nav { width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
  #main-nav a { padding: 7px 10px; font-size: 11.5px; }
  #view { padding: 16px 12px 60px; }
  table { min-width: 560px; }
  .modal { padding: 18px; }
}

</style>
</head>

   "notes": "Gespräch mit Tobias Fueter, Co-Founder Stories AG, am ADC Festival (Donnerstag letzte Woche).\n\nSEINE PROJEKTE:\n- Kompletter Werbespot 100% mit AI für Hiltl (veganes Restaurant): Tiere, die sich wie Menschen verhalten und alt sind.\n- Film für NZZ: Bei NZZ ist Echtheit zentral (Medien), aber Budget reichte nicht für klassische Produktion. Lösung: echte Menschen + echte Locations fotografiert, Buyouts an die Menschen gezahlt + sogar die Zeit vergütet, die sie am Set gewesen wären — dann alles mit AI gemacht. Film kostete 1/4 vom normalen Budget. ABER: trotzdem 6 Leute 6 Wochen lang beschäftigt (AI spart Geld, nicht zwingend Zeit).\n\nSEINE AKTUELLEN AI-LEARNINGS:\n- Das erste Startbild muss perfekt sein — dann kommt der Rest viel besser.\n- Die Szene muss genau so lang sein wie die Handlung selbst, damit das Generierte gleich lang ist.\n- Kein Schlussbild vorgeben, das generiert werden soll — die AI braucht Spielraum, sonst verquetscht sie Dinge.\n- Wenn ein generiertes Bild ziemlich gut aussieht: herunterladen und in Photoshop die Detailanpassungen machen.\n- Er macht den normalen Workflow trotzdem durch: Styling, 'Location-Scouting' etc.\n- SEHR WICHTIG bei Mixed Reality: Im Vordergrund muss etwas Echtes sein, die AI passiert in der Bildmitte. Sonst sieht es flach/ausgeschnitten aus, wenn AI im Vordergrund ist.\n\nTO DO:\n- Bild zum NZZ/Workflow existiert — Robin sendet es rein (Claude erinnern).\n- Tobias' Nummer haben wir jetzt — spätestens in 2 Wochen melden (Erinnerung setzen).",

   "rawIdea": "Kerngedanke aus Steve Jobs Hörbuch: mehrere Iterationen machen bis es perfekt ist.\n\nGenau das mache ich auch — aber öffentlich. Vor der Kamera sprechen, perfektionieren. Mein Stil von Videos und Filmen ist einer in dem ich mehrere Iterationen mache und so meinen Stil schleife bis zur Perfektion.\n\nApple hatte ein grosses Team das Feedback gibt. Steve selber holt viel Feedback von Verschiedenen ein. Das hole ich mir durch Kommentare, Views und Feedback von Leuten die mir folgen.\n\nLet go.\nConsistency brings the breakthrough.\nLet's get better together.\n\n---\n\nERGÄNZUNG:\n\nSteve macht es aus einem Gefühl. Andere haben Massenstudien gemacht. Er wusste es — er wusste was an einem Prototyp besser werden muss.\n\nGenau das mache ich auch. Mein Gefühl hat erste Priorität. Und dann das Gefühl von anderen Leuten, deren Meinung mir was bedeutet. (Den Teil mit Views und Likes anschauen, aber nicht als Hauptfokus.)\n\nIch weiss besser was Leute wollen — bin aber noch auf dem Weg. Sprich: es muss nicht direkt performen. Ich gehe meinen Weg bis zur Perfektion. So entsteht etwas Einzigartiges das nur ich genau auf meine Weise ausdrücken kann.",

   "title": "REEL Skript — Steve Jobs Buch-Geschichte für Filmmaker (Way to Oscar Episode 1)",
   "rawIdea": "REEL — Steve Jobs: eine Geschichte für Filmmaker\n\nBlueprint: Personal Story × Motivational Montage\nLänge: ca 85 Sek\nSprache: Englisch\nKernpunkt: Die stärksten Ideen kommen aus dem Bauch. Komitees polieren sie flach. Genau das was unvernünftig wirkt, macht den Film zu deinem.\n\n---\n\nTEXT-HOOK:\n1. 'a steve jobs story every filmmaker needs' (Pick)\n2. 'the $60 decision that built apple'\n3. 'why your gut beats the boardroom'\n\n---\n\nVOICEOVER:\n\nTake 1: There's a story in the Steve Jobs book that every filmmaker should hear.\n\nTake 2: Jony Ive walks into Steve's office with the new iMac. Translucent plastic. Five colors. Sixty dollars per unit, three times more than a normal case.\n\nTake 3: At any other company, that idea would have died in the next meeting.\n\nTake 4: First a market study. Then a focus group. Then a committee of twenty people, all wanting it a little safer, a little cheaper, a little more like everyone else. Until the original feeling is gone.\n\nTake 5: Steve looked at it and said yes.\n\nTake 6: Because he understood something the committees never see. They think color is decoration. Steve knew it was the whole experience. The reason a kid wants this one in their room. The reason a first-time buyer trusts the machine. The expensive part wasn't a cost. It was the product.\n\nTake 7: Here's what that means for your films.\n\nTake 8: Your strongest ideas come from a feeling. Not from analysis. The moment you run them through too many opinions, the one thing only you could have made disappears.\n\nTake 9: The shot you're afraid is too much is probably the one that makes the film yours. Don't smooth it out. Don't ask the committee. That edge is the whole point.\n\nTake 10: Trust the feeling. Keep building. Let's get better together.\n\n---\n\nCAPTION:\n\na steve jobs story every filmmaker needs.\n\nthe $60 case cost three times more.\nno studies. no committees. just a yes.\n\nthe expensive part wasn't a cost.\nit was the product.\n\ntrust the feeling.\nkeep the edge.\n\n---\n\nB-ROLL:\n- Buch in der Hand, Cover-Shot\n- Markierte Stelle Close-up\n- Bondi Blue iMac, alle fünf Farben wenn möglich (Stock)\n- Komitee-Visual: Hände am Whiteboard, Post-Its, Meeting-Raum (Stock)\n- DaVinci-Timeline, ein einzelner riskanter Cut, Hand auf Maus\n- Hand-auf-Brust-Geste\n- Walking-Shot mit Kamera, allein\n- Outro: Buch und Notizbuch nebeneinander, neuer Buchrücken daneben (Teaser Episode 2)\n\n---\n\nBELEG AUS DEM BUCH:\nJony Ive: 'In most places that decision would have taken months. Steve did it in a half hour.'\nErgebnis: 800.000 verkaufte iMacs im ersten Jahr, 32% Erstkäufer, schnellst-verkaufter Computer in Apples Geschichte bis dahin.",

   "notes": "Rohe Idee: REEL — Steve Jobs: eine Geschichte für Filmmaker\n\nBlueprint: Personal Story × Motivational Montage\nLänge: ca 85 Sek\nSprache: Englisch\nKernpunkt: Die stärksten Ideen kommen aus dem Bauch. Komitees polieren sie flach. Genau das was unvernünftig wirkt, macht den Film zu deinem.\n\n---\n\nTEXT-HOOK:\n1. 'a steve jobs story every filmmaker needs' (Pick)\n2. 'the $60 decision that built apple'\n3. 'why your gut beats the boardroom'\n\n---\n\nVOICEOVER:\n\nTake 1: There's a story in the Steve Jobs book that every filmmaker should hear.\n\nTake 2: Jony Ive walks into Steve's office with the new iMac. Translucent plastic. Five colors. Sixty dollars per unit, three times more than a normal case.\n\nTake 3: At any other company, that idea would have died in the next meeting.\n\nTake 4: First a market study. Then a focus group. Then a committee of twenty people, all wanting it a little safer, a little cheaper, a little more like everyone else. Until the original feeling is gone.\n\nTake 5: Steve looked at it and said yes.\n\nTake 6: Because he understood something the committees never see. They think color is decoration. Steve knew it was the whole experience. The reason a kid wants this one in their room. The reason a first-time buyer trusts the machine. The expensive part wasn't a cost. It was the product.\n\nTake 7: Here's what that means for your films.\n\nTake 8: Your strongest ideas come from a feeling. Not from analysis. The moment you run them through too many opinions, the one thing only you could have made disappears.\n\nTake 9: The shot you're afraid is too much is probably the one that makes the film yours. Don't smooth it out. Don't ask the committee. That edge is the whole point.\n\nTake 10: Trust the feeling. Keep building. Let's get better together.\n\n---\n\nCAPTION:\n\na steve jobs story every filmmaker needs.\n\nthe $60 case cost three times more.\nno studies. no committees. just a yes.\n\nthe expensive part wasn't a cost.\nit was the product.\n\ntrust the feeling.\nkeep the edge.\n\n---\n\nB-ROLL:\n- Buch in der Hand, Cover-Shot\n- Markierte Stelle Close-up\n- Bondi Blue iMac, alle fünf Farben wenn möglich (Stock)\n- Komitee-Visual: Hände am Whiteboard, Post-Its, Meeting-Raum (Stock)\n- DaVinci-Timeline, ein einzelner riskanter Cut, Hand auf Maus\n- Hand-auf-Brust-Geste\n- Walking-Shot mit Kamera, allein\n- Outro: Buch und Notizbuch nebeneinander, neuer Buchrücken daneben (Teaser Episode 2)\n\n---\n\nBELEG AUS DEM BUCH:\nJony Ive: 'In most places that decision would have taken months. Steve did it in a half hour.'\nErgebnis: 800.000 verkaufte iMacs im ersten Jahr, 32% Erstkäufer, schnellst-verkaufter Computer in Apples Geschichte bis dahin.\n\nFunke: Eine konkrete Geschichte aus dem Steve-Jobs-Buch übersetzt für Filmmaker. Die teure iMac-Entscheidung als Trojanisches Pferd für eine grössere Lesson: das Teure war das Magische. Komitees glätten Ideen flach. Genau die Kante macht den Film zu deinem.\n\nNächster Schritt: 1) Reel aufnehmen — 11labs Voice (Grandpa Spuds oder Adam-Slow). 2) B-Roll sammeln: Buch in der Hand, Bondi Blue iMac (Stock), DaVinci-Timeline-Cut, Walking-Shot. 3) Posten als Episode 1 der Buch-Serie. 4) Performance nach 48h checken — wenn zieht: zweites Buch direkt planen. 5) Learnings zurück in den Reel-Skript-Skill.",

   "title": "Steve Jobs Buch — 10 Erkenntnisse für meinen Weg zum Oscar (Master-Analyse)",
   "rawIdea": "ANALYSE — STEVE JOBS BUCH: 10 ERKENNTNISSE FÜR ROBINS WEG ZUM OSCAR\n\nDas Buch ist 670 Seiten, aber 10 Themen haben mit deinem Weg direkt zu tun. Hier in der Reihenfolge der Relevanz für dich, nicht des Buches.\n\n---\n\n1. BAUCHGEFÜHL SCHLÄGT MARKTSTUDIE\n\nBuchbeleg: Jony Ive zeigt Steve den iMac mit fünf Farben. Sechzig Dollar pro Gehäuse, dreimal teurer. Steve sagt sofort Ja. Ive später: 'In den meisten Firmen hätte diese Entscheidung Monate gedauert. Steve hat sie in einer halben Stunde getroffen.' Ergebnis: 800.000 verkaufte Geräte im ersten Jahr.\n\nFür dich: Das ist deine Methode. Du iterierst öffentlich, dein Bauch entscheidet zuerst, dann Inner Circle, dann Zahlen. Komitees glätten Ideen flach. Episode 1 der Buch-Serie ist schon gebaut.\n\n---\n\n2. FOKUS IST NEIN SAGEN\n\nBuchbeleg: Steve kommt 1997 zurück zu Apple. Statt mehr Produkte streicht er fast alles. Vier Quadranten an der Whiteboard: Consumer / Pro mal Desktop / Portable. Vier Produkte. Punkt. Markkulas ursprüngliche Apple-Marketing-Philosophie hatte Fokus als Punkt 2: 'Um die Dinge gut zu machen die wir tun, müssen wir alle unübrigen Gelegenheiten eliminieren.'\n\nFür dich: Du machst gerade viel parallel. Lohro YouTube, Story Wins, Next Shot, Kollektiv Oskar, Oskar-Kurzfilm. Frage: Was sind deine vier Quadranten? Wenn du auf 4 Felder reduzierst, was fällt raus? Das ist der schwerste und vielleicht wichtigste Schritt 2026.\n\n---\n\n3. A PLAYERS WOLLEN NUR MIT A PLAYERS ARBEITEN\n\nBuchbeleg: Steve: 'Bei den meisten Sachen liegt der Unterschied zwischen Best und Average bei 30 Prozent. Bei Woz war es das Fünfzigfache. Das Mac-Team war der Versuch ein ganzes Team daraus zu bauen. A Players. Die Leute sagten sie würden sich hassen, aber A Players wollen mit A Players arbeiten. Sie wollen nur nicht mit C Players arbeiten.'\n\nFür dich: Simon ist dein Co-Founder. Lua als Podcast-Co-Host. Die Frage ist nicht ob du in deinem Umfeld nur A-Players hast, sondern ob du dich zu A-Players hin bewegst. Mentor-Track, Cape Town Filmmaker, Filmmaker-Screening-Nights. Genau die Strategie die du schon machst.\n\n---\n\n4. AN DER KREUZUNG VON KUNST UND TECHNIK STEHEN\n\nBuchbeleg: Steve: 'Ich sah mich immer als Geisteswissenschaftler. Aber ich liebte Elektronik. Dann las ich was Edwin Land von Polaroid über die Wichtigkeit von Menschen sagte die an der Kreuzung von Geisteswissenschaft und Technik stehen. Ich entschied das ist was ich werden will.' Auf dem letzten Slide der iPad-Präsentation: ein Straßenschild Technology Street Ecke Liberal Arts Street.\n\nFür dich: Du bist genau das. Filmemacher (Liberal Arts) und Tech-affin (Sony FX3, KI, Higgsfield, Workflow-Skills, Notion-Systeme). Das ist nicht zwei Welten, das ist deine Kreuzung. Daraus wird Lohros Differenzierung.\n\n---\n\n5. END-TO-END KONTROLLE ÜBER DAS GANZE WERK\n\nBuchbeleg: Steve glaubte an 'whole widgets', durchdesignt vom Stromkabel über die Software bis zur Verpackung. Das ganze Erlebnis. Geschlossen, weil sonst die Vision kaputt geht.\n\nFür dich: Du hast das instinktiv schon. Drehbuch, Kamera, Schnitt, Sounddesign, Caption, Posting, Performance-Analyse. Das ist deine 'whole widget'-Methode. Das ist warum dein Stuff zusammenhängt und nicht nach Outsourcing aussieht. Festhalten an dieser Kontrolle, auch wenn das Wachstum dich versuchen wird zu delegieren.\n\n---\n\n6. DETAILS DIE NIEMAND SIEHT\n\nBuchbeleg: Steve bestand darauf dass die Leiterplatten im Macintosh schön aussehen, obwohl niemand sie je sieht. 'Wenn du Schreiner bist und einen schönen Schrank baust, nimmst du nicht hinten ein Stück Sperrholz, nur weil es zur Wand zeigt. Du weißt es ist da, also legst du auch hinten ein schönes Stück Holz.' Sein Vater Paul hatte ihm das beigebracht.\n\nFür dich: Genau das ist Filmcraft. Der Frame, den niemand bewusst registriert, der die Szene trotzdem trägt. Der Sound der drei Frames vor dem Cut beginnt. Die Lichtstimmung im Hintergrund. Das ist nicht Perfektionismus zum Selbstzweck — das ist Care, die der Zuschauer fühlt ohne sie zu sehen.\n\n---\n\n7. GROSSE KÜNSTLER STEHLEN\n\nBuchbeleg: Steve zitiert Picasso: 'Gute Künstler kopieren, große Künstler stehlen.' Die Mac-GUI kam von Xerox PARC. Steve hatte keine Scham es zu nehmen, weil er es weiterentwickelt hat. Inspiration und Klau sind näher beisammen als Reinheits-Liebhaber wahrhaben wollen.\n\nFür dich: Deine Vorbilder sind Interstellar, Breaking Bad, Severance, frühes A24, früher Kanye. Du sollst stehlen. Komposition von Severance, Pacing von Breaking Bad, Texturen von A24. Keine Schuldgefühle. Verarbeiten und transformieren. So entsteht eine Stimme.\n\n---\n\n8. STORY KOMMT VOR ALLEM\n\nBuchbeleg: Pixar hatte die beste Animations-Tech der Welt. Steve verbrannte zehn Jahre und 50 Millionen Dollar damit Hardware und 3D-Software zu verkaufen. Erst als sie sich auf Story konzentrierten kam Toy Story und alles änderte sich. Steve später: 'Wenn ich gewusst hätte was ich heute weiß, hätte ich von Anfang an auf Animation fokussiert.'\n\nFür dich: Du kennst McKee. Du weißt das. Aber: deine YouTube-Stats, dein Equipment, deine Sony FX3, deine Lichttechnik — das ist alles Pixars Hardware. Story ist warum Toy Story funktioniert hat. Bei dir ist das das Skript zu 'Der Junge im Nebel' und die McKee-Lesson die du tatsächlich anwendest. Gehört das gerade so viel Energie wie es verdient?\n\n---\n\n9. CONNECTING THE DOTS GEHT NUR RÜCKWÄRTS\n\nBuchbeleg: Stanford Commencement 2005. Steve erzählt wie er als College-Dropout in eine Kalligraphie-Klasse rein ist die scheinbar nutzlos war. Zehn Jahre später wurde sie zur Grundlage für die Mac-Typografie. 'Du kannst die Punkte nicht nach vorne verbinden. Nur rückwärts. Du musst darauf vertrauen dass sie sich irgendwie verbinden werden.'\n\nFür dich: Sechs Jahre selbstständig. Cape Town. HSG-Filme. Männerchor. Apophis. Lohro. Das alles wirkt manchmal wie viele Punkte ohne Linie. Steve sagt: das ist normal. Die Linie wird sichtbar wenn du auf 70 zurückschaust. Bis dahin: jeden Punkt ernst nehmen, auch die scheinbar zufälligen.\n\n---\n\n10. MORTALITÄT ALS KOMPASS\n\nBuchbeleg: Steve bei Stanford: 'Sich daran zu erinnern dass ich bald sterbe ist das wichtigste Werkzeug das ich je gefunden habe um mir bei den großen Entscheidungen im Leben zu helfen. Weil fast alles — alle externen Erwartungen, aller Stolz, alle Angst vor Blöße oder Versagen — vor dem Tod einfach abfällt. Nur das was wirklich wichtig ist bleibt.'\n\nFür dich: Du bist Christ. Das hast du anders verankert als Steve, aber die Mechanik ist die gleiche. Was bleibt wenn alles abfällt? Familie. Werk das aus echtem Gefühl entstanden ist. Menschen die du beeinflusst hast. Oskar ist nicht das Ziel. Oskar ist ein Symbol für ein Leben das echt war. Wichtig zu wissen vor allem an Tagen wo der Algorithmus zu lange schweigt.\n\n---\n\nWAS DAS BUCH ÜBER DICH ZEIGT (Rückspiegelung)\n\nWas du schon lebst: Bauchgefühl-Methode, End-to-End-Kontrolle, Details die niemand sieht, Intersection von Kunst und Tech, Story-Bewusstsein durch McKee.\n\nWo Steve dich treffen würde: Fokus — zu viele Spuren parallel. Reduktion — zu wenig löschen. Brutalität bei Cuts — zu viel weiter machen, zu wenig weglassen.\n\nWas du hast was Steve nicht hatte: Glaube als Fundament, kein zerstörerisches Ego, gesunde Beziehung, kein Bedürfnis Menschen zu verletzen um Werk zu erschaffen. Das ist eine schwerere Disziplin als Steves Brutalität. Aber es ist deine.\n\n---\n\nIN EINEM SATZ\n\nDas Buch sagt dir nichts Neues. Es bestätigt was du spürst und gibt dir die Sprache und die Vorbilder. Steve hat den Beweis erbracht dass dieser Weg funktioniert. Du musst nur durchhalten.",

<script>
/* ============ util.js — helpers, DOM, dates, modal, toast ============ */
"use strict";

function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function el(html) {
  var t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function uid(prefix) {
  return (prefix || "id") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
}

/* ---------- dates ---------- */
function todayISO() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function parseISO(iso) {
  if (!iso) return null;
  var p = String(iso).slice(0, 10).split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function fmtDate(iso, opts) {
  var d = parseISO(iso);
  if (!d || isNaN(d)) return "—";
  return d.toLocaleDateString("en-GB", opts || { day: "numeric", month: "short", year: "numeric" });
}
function fmtDateShort(iso) { return fmtDate(iso, { day: "numeric", month: "short" }); }
function addDays(iso, n) {
  var d = parseISO(iso);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function daysBetween(isoA, isoB) {
  var a = parseISO(isoA), b = parseISO(isoB);
  return Math.round((b - a) / 86400000);
}
function weekdayShort(iso) {
  var d = parseISO(iso);
  return d.toLocaleDateString("en-GB", { weekday: "short" });
}
function fmtNum(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString("en-US");
}
function fmtCompact(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + "M";
  if (n >= 1000) return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + "K";
  return String(n);
}

/* ---------- modal ---------- */
function openModal(innerHTML, opts) {
  closeModal();
  var root = $("#modal-root");
  var backdrop = el('<div class="modal-backdrop"><div class="modal">' + innerHTML + "</div></div>");
  backdrop.addEventListener("mousedown", function (e) {
    if (e.target === backdrop && !(opts && opts.sticky)) closeModal();
  });
  root.appendChild(backdrop);
  var firstInput = $("input, textarea, select", backdrop);
  if (firstInput) setTimeout(function () { firstInput.focus(); }, 30);
  return backdrop;
}
function closeModal() { $("#modal-root").innerHTML = ""; }
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

/* ---------- toast ---------- */
function toast(msg, isError) {
  var t = el('<div class="toast' + (isError ? " error" : "") + '">' + esc(msg) + "</div>");
  $("#toast-root").appendChild(t);
  setTimeout(function () { t.remove(); }, 2600);
}

/* ---------- tiny SVG line chart ---------- */
function sparkline(points, opts) {
  // points: [{x: number(ms or index), y: number}] sorted by x
  opts = opts || {};
  var w = opts.width || 600, h = opts.height || 160, pad = 26;
  if (!points || points.length === 0) return '<div class="empty-note">No data points yet.</div>';
  var xs = points.map(function (p) { return p.x; });
  var ys = points.map(function (p) { return p.y; });
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var minY = 0, maxY = Math.max(Math.max.apply(null, ys), opts.goal || 0, 10);
  if (maxX === minX) maxX = minX + 1;
  function X(v) { return pad + ((v - minX) / (maxX - minX)) * (w - pad * 2); }
  function Y(v) { return h - pad - ((v - minY) / (maxY - minY)) * (h - pad * 2); }
  var path = points.map(function (p, i) { return (i === 0 ? "M" : "L") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1); }).join(" ");
  var dots = points.map(function (p) {
    return '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="3.2" fill="#2A9D8F"/>';
  }).join("");
  var goalLine = "";
  if (opts.goal) {
    goalLine = '<line x1="' + pad + '" x2="' + (w - pad) + '" y1="' + Y(opts.goal).toFixed(1) + '" y2="' + Y(opts.goal).toFixed(1) +
      '" stroke="#D4AF37" stroke-dasharray="5 5" stroke-width="1.2" opacity=".8"/>' +
      '<text x="' + (w - pad) + '" y="' + (Y(opts.goal) - 6).toFixed(1) + '" text-anchor="end" fill="#D4AF37" font-size="11">Goal ' + fmtCompact(opts.goal) + "</text>";
  }
  var area = path + " L" + X(maxX).toFixed(1) + " " + Y(minY).toFixed(1) + " L" + X(minX).toFixed(1) + " " + Y(minY).toFixed(1) + " Z";
  return '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid meet" role="img">' +
    '<defs><linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#2A9D8F" stop-opacity=".35"/><stop offset="100%" stop-color="#2A9D8F" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#sparkfill)"/>' +
    goalLine +
    '<path d="' + path + '" fill="none" stroke="#2A9D8F" stroke-width="2.2" stroke-linejoin="round"/>' +
    dots + "</svg>";
}

/* ---------- download / upload ---------- */
function downloadJSON(obj, filename) {
  var blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function pickJSONFile(cb) {
  var input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.onchange = function () {
    var f = input.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try { cb(null, JSON.parse(r.result), f.name); }
      catch (e) { cb(e); }
    };
    r.readAsText(f);
  };
  input.click();
}

</script>

  function load() {
    var raw = null;

    }

  /* ---------- export / import ---------- */
  function exportSnapshot() {
    var snap = JSON.parse(JSON.stringify(state));
    snap.meta.exportedAt = new Date().toISOString();
    snap.meta.exportedBy = state.settings.userName || "unknown";
    return snap;
  }

  function validateSnapshot(obj) {
    return obj && typeof obj === "object" && obj.meta && obj.meta.app === "way-to-oscar-command-center";
  }

  function importReplace(obj) {
    if (!validateSnapshot(obj)) throw new Error("Not a WAY TO OSCAR data file");
    var d = defaults();
    Object.keys(d).forEach(function (k) { if (obj[k] === undefined) obj[k] = d[k]; });
    state = obj;
    persist();
  }

  function newer(a, b) {
    var ta = a && a.updatedAt ? a.updatedAt : "";
    var tb = b && b.updatedAt ? b.updatedAt : "";
    return tb > ta ? b : a;
  }

  function mergeById(mine, theirs) {
    var map = {};
    mine.forEach(function (x) { map[x.id] = x; });
    theirs.forEach(function (x) {
      if (!x || !x.id) return;
      map[x.id] = map[x.id] ? newer(map[x.id], x) : x;
    });
    return Object.keys(map).map(function (k) { return map[k]; });
  }

  function importMerge(obj) {
    if (!validateSnapshot(obj)) throw new Error("Not a WAY TO OSCAR data file");
    state.ideas = mergeById(state.ideas, obj.ideas || []);
    state.projects = mergeById(state.projects, obj.projects || []);
    state.milestones = mergeById(state.milestones, obj.milestones || []);
    state.followers = mergeById(state.followers, obj.followers || []);
    var days = obj.challengeDays || {};
    Object.keys(days).forEach(function (dkey) {
      state.challengeDays[dkey] = state.challengeDays[dkey] ? newer(state.challengeDays[dkey], days[dkey]) : days[dkey];
    });
    var plans = obj.festivalPlans || {};
    Object.keys(plans).forEach(function (fid) {
      state.festivalPlans[fid] = state.festivalPlans[fid] ? newer(state.festivalPlans[fid], plans[fid]) : plans[fid];
    });
    // settings: theirs win only if their file is newer overall
    if ((obj.meta.updatedAt || "") > (state.meta.updatedAt || "")) {
      state.settings = Object.assign({}, state.settings, obj.settings || {});
    }
    persist();
  }

  function resetToSeed() {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    state = seedInto(defaults());
    persist();
  }

  load();

  return {
    get: function () { return state; },
    save: persist,
    onChange: function (fn) { listeners.push(fn); },
    festivals: festivals,
    academyRules: academyRules,
    exportSnapshot: exportSnapshot,
    importReplace: importReplace,
    importMerge: importMerge,
    resetToSeed: resetToSeed,
    defaultMilestones: defaultMilestones
  };
})();
