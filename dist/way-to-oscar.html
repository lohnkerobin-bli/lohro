<script>
/* ============ dashboard.js — countdown, followers, milestones ============ */
"use strict";

var DashboardView = (function () {

  function countdownHTML(targetISO) {
    var now = new Date();
    var target = parseISO(targetISO);
    var ms = target - now;
    if (ms < 0) ms = 0;
    var days = Math.floor(ms / 86400000);
    var hours = Math.floor((ms % 86400000) / 3600000);
    var mins = Math.floor((ms % 3600000) / 60000);
    var secs = Math.floor((ms % 60000) / 1000);
    function box(n, l) {
      return '<div class="unit-box"><div class="num">' + n + '</div><div class="lbl">' + l + "</div></div>";
    }
    return box(days, "days") + box(hours, "hours") + box(mins, "min") + box(secs, "sec");
  }

  function latestFollowers(platform) {
    var s = Store.get();
    var pts = s.followers.filter(function (f) { return f.platform === platform; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    return pts.length ? pts[pts.length - 1] : null;
  }

  function growthProjection() {
    var s = Store.get();
    var pts = s.followers.filter(function (f) { return f.platform === "instagram"; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (pts.length < 2) return null;
    var first = pts[0], last = pts[pts.length - 1];
    var days = Math.max(daysBetween(first.date, last.date), 1);
    var perDay = (last.count - first.count) / days;
    if (perDay <= 0) return { perDay: perDay, eta: null };
    var remaining = s.settings.followerGoal - last.count;
    var etaDays = Math.ceil(remaining / perDay);
    return { perDay: perDay, eta: addDays(last.date, etaDays), etaDays: etaDays };
  }

  function challengeStats() {
    var s = Store.get();
    var start = s.settings.challengeStart;
    var today = todayISO();
    var days = Object.keys(s.challengeDays).map(function (k) { return s.challengeDays[k]; });
    var published = days.filter(function (d) { return d.status === "published"; }).length;
    var elapsed = Math.max(0, daysBetween(start, today) + 1);
    if (today < start) elapsed = 0;
    // streak: consecutive published days ending today or yesterday
    var streak = 0;
    var cursor = today;
    if (!(s.challengeDays[cursor] && s.challengeDays[cursor].status === "published")) cursor = addDays(today, -1);
    while (s.challengeDays[cursor] && s.challengeDays[cursor].status === "published") {
      streak++;
      cursor = addDays(cursor, -1);
    }
    return { published: published, elapsed: elapsed, streak: streak, started: today >= start };
  }

  function nextDeadlines(limit) {
    var today = todayISO();
    var rows = [];
    Store.festivals().forEach(function (f) {
      (f.deadlines || []).forEach(function (d) {
        if (d.date && d.date >= today) rows.push({ festival: f, deadline: d });
      });
    });
    rows.sort(function (a, b) { return a.deadline.date < b.deadline.date ? -1 : 1; });
    // one (earliest) deadline per festival
    var seen = {}, out = [];
    rows.forEach(function (r) {
      if (seen[r.festival.id]) return;
      seen[r.festival.id] = true;
      out.push(r);
    });
    return out.slice(0, limit || 5);
  }

  function addFollowerModal() {
    var html =
      '<h3>Add follower data point</h3>' +
      '<label class="field"><span>Platform</span><select id="f-platform">' +
      '<option value="instagram">Instagram (@lohro)</option>' +
      '<option value="youtube">YouTube (Way to Oscar)</option>' +
      '<option value="tiktok">TikTok</option></select></label>' +
      '<label class="field"><span>Date</span><input type="date" id="f-date" value="' + todayISO() + '"></label>' +
      '<label class="field"><span>Follower count</span><input type="number" id="f-count" min="0" placeholder="e.g. 12500"></label>' +
      '<div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="primary" id="f-save">Save</button></div>';
    openModal(html);
    $("#f-save").onclick = function () {
      var count = parseInt($("#f-count").value, 10);
      if (isNaN(count) || count < 0) { toast("Enter a valid count", true); return; }
      Store.get().followers.push({
        id: uid("fol"), date: $("#f-date").value || todayISO(),
        platform: $("#f-platform").value, count: count,
        updatedAt: new Date().toISOString()
      });
      Store.save();
      closeModal(); toast("Follower data point saved");
      App.render();
    };
  }

  function addMilestoneModal() {
    var html =
      '<h3>Add milestone</h3>' +
      '<label class="field"><span>Title</span><input id="m-title" placeholder="e.g. Sign a festival mentor"></label>' +
      '<label class="field"><span>Target date</span><input type="date" id="m-date"></label>' +
      '<label class="field"><span>Track</span><select id="m-track">' +
      '<option value="A">Track A — Festival films</option>' +
      '<option value="B">Track B — Personal brand</option></select></label>' +
      '<div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="primary" id="m-save">Save</button></div>';
    openModal(html);
    $("#m-save").onclick = function () {
      var title = $("#m-title").value.trim();
      if (!title) { toast("Title required", true); return; }
      Store.get().milestones.push({
        id: uid("ms"), title: title, date: $("#m-date").value || null,
        done: false, track: $("#m-track").value, updatedAt: new Date().toISOString()
      });
      Store.save(); closeModal(); toast("Milestone added"); App.render();
    };
  }

  function todayStripHTML() {
    var s = Store.get();
    var today = todayISO();
    var start = s.settings.challengeStart;
    var parts = [];
    // challenge status today
    if (today >= start) {
      var dayNum = daysBetween(start, today) + 1;
      var entry = s.challengeDays[today];
      var done = entry && entry.status === "published";
      parts.push('<span>🎬 <strong>Day ' + dayNum + '</strong> — ' +
        (done ? '<span class="badge teal">published ✓</span>'
          : entry && entry.title ? '<span class="badge blue">' + esc(entry.status) + ": " + esc(entry.title) + '</span>'
          : '<span class="badge red">no film logged yet</span>') +
        ' <a href="#/challenge">log →</a></span>');
    } else {
      parts.push('<span>🎬 Challenge starts <strong>' + fmtDate(start) + '</strong> — ' + daysBetween(today, start) + ' days to prepare</span>');
    }
    // most urgent deadline
    var next = nextDeadlines(1)[0];
    if (next) {
      var d = daysBetween(today, next.deadline.date);
      parts.push('<span>⏰ Next deadline: <strong>' + esc(next.festival.name) + '</strong> in ' +
        '<span class="badge ' + (d <= 21 ? "red" : "gray") + '">' + d + ' days</span> <a href="#/festivals">plan →</a></span>');
    }
    // principle of the day
    var st = window.SEED && window.SEED.strategy;
    if (st && st.principles && st.principles.length) {
      var doy = Math.floor((parseISO(today) - new Date(parseISO(today).getFullYear(), 0, 0)) / 86400000);
      parts.push('<span class="muted">💭 ' + esc(st.principles[doy % st.principles.length]) + '</span>');
    }
    return '<div class="card mb" style="padding:12px 18px"><div class="row" style="gap:22px;font-size:13.5px">' +
      parts.join("") + '</div></div>';
  }

  function strategyHTML() {
    var st = window.SEED && window.SEED.strategy;
    if (!st) return "";
    return '<h2 class="section-title">Strategy Briefing <span class="muted" style="letter-spacing:0;text-transform:none;font-weight:400">(from your Notion master plan)</span></h2>' +
      '<div class="card accent-gold mb"><span class="stat-label">North Star</span>' +
      '<p class="mt" style="font-size:14.5px;font-weight:600">' + esc(st.northStar) + '</p>' +
      '<p class="muted mt" style="font-size:12.5px">' + esc(st.oscarHorizon) + '</p></div>' +
      '<div class="grid cols-2">' +
      ['A', 'B'].map(function (k) {
        var t = st.tracks[k];
        if (!t) return "";
        return '<div class="card ' + (k === "A" ? "accent-gold" : "accent-teal") + '">' +
          '<span class="stat-label">' + esc(t.name) + '</span>' +
          '<p class="mt" style="font-size:13px">' + esc(t.focus) + '</p>' +
          (t.priority1 ? '<p class="mt" style="font-size:13px"><span class="badge red">Priority 1</span> ' + esc(t.priority1) + '</p>' : "") +
          '<p class="muted mt" style="font-size:12.5px">⚠ ' + esc(t.rule) + '</p></div>';
      }).join("") + '</div>' +
      '<div class="card mt"><span class="stat-label">Operating principles</span><ul class="mt" style="padding-left:20px;font-size:13.5px;line-height:1.9">' +
      (st.principles || []).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join("") +
      '</ul></div>';
  }

  var tickTimer = null;

  function render(root) {
    var s = Store.get();
    var ig = latestFollowers("instagram");
    var yt = latestFollowers("youtube");
    var proj = growthProjection();
    var ch = challengeStats();
    var goal = s.settings.followerGoal;
    var igCount = ig ? ig.count : 0;
    var pct = Math.min(100, (igCount / goal) * 100);
    var challengeStartsIn = daysBetween(todayISO(), s.settings.challengeStart);

    var igPoints = s.followers.filter(function (f) { return f.platform === "instagram"; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; })
      .map(function (f) { return { x: parseISO(f.date).getTime(), y: f.count }; });

    var deadlines = nextDeadlines(5);
    var milestones = s.milestones.slice().sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return (a.date || "9999") < (b.date || "9999") ? -1 : 1;
    });

    root.innerHTML =
      '<h1 class="view-title">Dashboard</h1>' +
      '<p class="view-sub">Two tracks, one goal. Track A: festival films. Track B: 1M followers. Destination: the Oscar stage.</p>' +

      todayStripHTML() +

      '<div class="grid cols-2">' +
        '<div class="card accent-gold">' +
          '<div class="row between"><span class="stat-label">🏆 Countdown to the Oscars</span>' +
          '<span class="badge gold">' + esc(s.settings.oscarCeremonyLabel) + '</span></div>' +
          '<div class="countdown mt" id="oscar-countdown">' + countdownHTML(s.settings.oscarCeremonyDate) + '</div>' +
        '</div>' +
        '<div class="card accent-red">' +
          '<div class="row between"><span class="stat-label">🎬 Daily Short Film Challenge</span>' +
          (ch.started
            ? '<span class="badge red">LIVE</span>'
            : '<span class="badge">starts in ' + challengeStartsIn + ' days</span>') +
          '</div>' +
          '<div class="row mt" style="gap:26px">' +
            '<div><div class="stat-value">' + ch.published + '</div><div class="stat-hint">films published</div></div>' +
            '<div><div class="stat-value">' + ch.streak + '<span class="unit"> 🔥</span></div><div class="stat-hint">day streak</div></div>' +
            '<div><div class="stat-value">' + (ch.started ? ch.elapsed : 0) + '</div><div class="stat-hint">days elapsed</div></div>' +
          '</div>' +
          '<div class="mt"><a href="#/challenge" class="btn">Open challenge board →</a></div>' +
        '</div>' +
      '</div>' +

      '<h2 class="section-title">Track B — Follower Growth</h2>' +
      '<div class="grid cols-3">' +
        '<div class="card accent-teal">' +
          '<span class="stat-label">Instagram @lohro</span>' +
          '<div class="stat-value">' + fmtCompact(igCount) + '</div>' +
          '<div class="progress mt"><div style="width:' + pct.toFixed(2) + '%"></div></div>' +
          '<div class="stat-hint mt">' + pct.toFixed(1) + '% of ' + fmtCompact(goal) + ' goal' +
          (ig ? ' · updated ' + fmtDateShort(ig.date) : " · no data yet") + '</div>' +
        '</div>' +
        '<div class="card accent-blue">' +
          '<span class="stat-label">YouTube — Way to Oscar</span>' +
          '<div class="stat-value">' + fmtCompact(yt ? yt.count : 0) + '</div>' +
          '<div class="stat-hint">' + (yt ? 'updated ' + fmtDateShort(yt.date) : "no data yet") + '</div>' +
        '</div>' +
        '<div class="card">' +
          '<span class="stat-label">Projection to 1M</span>' +
          (proj && proj.eta
            ? '<div class="stat-value">' + fmtDate(proj.eta) + '</div><div class="stat-hint">+' + fmtNum(Math.round(proj.perDay)) + '/day · ' +
              (proj.eta <= s.settings.followerGoalDate ? '<span class="badge teal">on track</span>' : '<span class="badge red">behind goal date</span>') + '</div>'
            : '<div class="stat-value">—</div><div class="stat-hint">add ≥2 Instagram data points to project</div>') +
        '</div>' +
      '</div>' +
      '<div class="card mt chart-box">' +
        '<div class="row between"><span class="stat-label">Instagram growth</span>' +
        '<button class="primary small" id="add-follower">+ Add data point</button></div>' +
        '<div class="mt">' + sparkline(igPoints, { goal: goal }) + '</div>' +
      '</div>' +

      '<h2 class="section-title">Next Festival Deadlines</h2>' +
      (deadlines.length === 0
        ? '<div class="empty-note">No upcoming deadlines found.</div>'
        : '<div class="table-wrap"><table><thead><tr><th>Deadline</th><th>Festival</th><th>Type</th><th>Fee</th><th>Oscar-qualifying</th></tr></thead><tbody>' +
          deadlines.map(function (r) {
            var days = daysBetween(todayISO(), r.deadline.date);
            return '<tr class="clickable" onclick="location.hash=\'#/festivals\'">' +
              '<td><span class="mono">' + fmtDate(r.deadline.date) + '</span> <span class="badge ' + (days <= 21 ? "red" : "gray") + '">' + days + 'd</span>' +
              (r.deadline.estimated ? ' <span class="badge">est.</span>' : "") + '</td>' +
              '<td><strong>' + esc(r.festival.name) + '</strong><br><span class="muted">' + esc(r.festival.city || "") + ", " + esc(r.festival.country || "") + '</span></td>' +
              '<td>' + esc(r.deadline.type) + '</td>' +
              '<td>' + (r.deadline.feeAmount != null ? r.deadline.feeAmount + " " + esc(r.deadline.feeCurrency || "") : "—") + '</td>' +
              '<td>' + (r.festival.oscarQualifying ? '<span class="badge gold">YES</span>' : '<span class="badge">no</span>') + '</td></tr>';
          }).join("") + "</tbody></table></div>") +

      '<h2 class="section-title">Milestones</h2>' +
      '<div class="card">' +
        milestones.map(function (m) {
          return '<div class="milestone-row ' + (m.done ? "done" : "") + '">' +
            '<input type="checkbox" data-ms="' + esc(m.id) + '" ' + (m.done ? "checked" : "") + '>' +
            '<span class="badge ' + (m.track === "A" ? "gold" : "teal") + '">' + (m.track === "A" ? "Track A" : "Track B") + '</span>' +
            '<span class="m-title">' + esc(m.title) + '</span>' +
            '<span class="m-date">' + (m.date ? fmtDate(m.date) : "") + '</span>' +
            '<button class="small ghost danger" data-del-ms="' + esc(m.id) + '" title="Delete">✕</button>' +
          '</div>';
        }).join("") +
        '<div class="mt"><button id="add-milestone">+ Add milestone</button></div>' +
      '</div>' +
      strategyHTML();

    $("#add-follower").onclick = addFollowerModal;
    $("#add-milestone").onclick = addMilestoneModal;
    $$("input[data-ms]", root).forEach(function (cb) {
      cb.onchange = function () {
        var m = Store.get().milestones.find(function (x) { return x.id === cb.getAttribute("data-ms"); });
        if (m) { m.done = cb.checked; m.updatedAt = new Date().toISOString(); Store.save(); App.render(); }
      };
    });
    $$("button[data-del-ms]", root).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-del-ms");
        var st = Store.get();
        st.milestones = st.milestones.filter(function (x) { return x.id !== id; });
        Store.save(); App.render();
      };
    });

    // live countdown tick
    if (tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(function () {
      var elCd = $("#oscar-countdown");
      if (!elCd) { clearInterval(tickTimer); tickTimer = null; return; }
      elCd.innerHTML = countdownHTML(Store.get().settings.oscarCeremonyDate);
    }, 1000);
  }

  return { render: render };
})();

</script>
<script>
/* ============ challenge.js — Daily Short Film Challenge tracker ============ */
"use strict";

var ChallengeView = (function () {

  var STATUSES = [
    { key: "planned", label: "Planned" },
    { key: "shooting", label: "Shooting" },
    { key: "editing", label: "Editing" },
    { key: "published", label: "Published" },
    { key: "skipped", label: "Skipped" }
  ];

  function dayList() {
    var s = Store.get();
    var start = s.settings.challengeStart;
    var today = todayISO();
    var end = addDays(today > start ? today : start, 7); // lookahead
    var out = [];
    var d = start;
    while (d <= end) {
      out.push(d);
      d = addDays(d, 1);
    }
    return out;
  }

  function editDayModal(dateISO) {
    var s = Store.get();
    var day = s.challengeDays[dateISO] || { date: dateISO, title: "", idea: "", status: "planned", link: "", learnings: "" };
    var dayNum = daysBetween(s.settings.challengeStart, dateISO) + 1;
    var html =
      '<h3>Day ' + dayNum + ' — ' + fmtDate(dateISO, { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + '</h3>' +
      '<label class="field"><span>Film title</span><input id="d-title" value="' + esc(day.title) + '" placeholder="Working title"></label>' +
      '<label class="field"><span>Idea / logline</span><textarea id="d-idea" placeholder="One-sentence story...">' + esc(day.idea) + '</textarea></label>' +
      '<label class="field"><span>Status</span><select id="d-status">' +
      STATUSES.map(function (st) {
        return '<option value="' + st.key + '"' + (day.status === st.key ? " selected" : "") + '>' + st.label + '</option>';
      }).join("") + '</select></label>' +
      '<label class="field"><span>Link (YouTube / Instagram / Drive)</span><input id="d-link" value="' + esc(day.link) + '" placeholder="https://..."></label>' +
      '<label class="field"><span>Learnings</span><textarea id="d-learnings" placeholder="What did today teach you?">' + esc(day.learnings) + '</textarea></label>' +
      '<div class="modal-actions">' +
      (s.challengeDays[dateISO] ? '<button class="ghost danger" id="d-delete">Delete</button>' : "") +
      '<button class="ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="primary" id="d-save">Save</button></div>';
    openModal(html);
    $("#d-save").onclick = function () {
      s.challengeDays[dateISO] = {
        date: dateISO,
        title: $("#d-title").value.trim(),
        idea: $("#d-idea").value.trim(),
        status: $("#d-status").value,
        link: $("#d-link").value.trim(),
        learnings: $("#d-learnings").value.trim(),
        updatedAt: new Date().toISOString()
      };
      Store.save(); closeModal(); toast("Day " + dayNum + " saved"); App.render();
    };
    var del = $("#d-delete");
    if (del) del.onclick = function () {
      delete s.challengeDays[dateISO];
      Store.save(); closeModal(); toast("Entry removed"); App.render();
    };
  }

  function render(root) {
    var s = Store.get();
    var today = todayISO();
    var start = s.settings.challengeStart;
    var days = dayList();
    var entries = Object.keys(s.challengeDays).map(function (k) { return s.challengeDays[k]; });
    var published = entries.filter(function (e) { return e.status === "published"; });
    var withLearnings = entries.filter(function (e) { return e.learnings; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var elapsed = today >= start ? daysBetween(start, today) + 1 : 0;
    var rate = elapsed > 0 ? Math.round((published.length / elapsed) * 100) : 0;

    root.innerHTML =
      '<h1 class="view-title">Daily Challenge</h1>' +
      '<p class="view-sub">One short film every day, starting ' + fmtDate(start, { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + '. Click a day to log it.</p>' +

      '<div class="grid cols-4 mb">' +
        '<div class="card accent-teal"><span class="stat-label">Published</span><div class="stat-value">' + published.length + '</div></div>' +
        '<div class="card accent-blue"><span class="stat-label">Days elapsed</span><div class="stat-value">' + elapsed + '</div></div>' +
        '<div class="card accent-red"><span class="stat-label">Hit rate</span><div class="stat-value">' + rate + '<span class="unit">%</span></div></div>' +
        (function () {
          var horizon = 0;
          for (var i = 1; i <= 14; i++) {
            var dd = addDays(today, i);
            if (dd >= start && s.challengeDays[dd] && (s.challengeDays[dd].title || s.challengeDays[dd].idea)) horizon++;
          }
          var cls = horizon >= 10 ? "teal" : horizon >= 5 ? "gold" : "red";
          return '<div class="card accent-gold"><span class="stat-label">Planned next 14 days</span>' +
            '<div class="stat-value">' + horizon + '<span class="unit">/14</span></div>' +
            '<div class="stat-hint"><span class="badge ' + cls + '">' + (horizon >= 10 ? "healthy pipeline" : horizon >= 5 ? "plan more" : "pipeline empty") + '</span> Editor Bible: plan 2 weeks ahead</div></div>';
        })() +
      '</div>' +

      '<h2 class="section-title">Day Board</h2>' +
      '<div class="day-grid">' +
      days.map(function (d) {
        var e = s.challengeDays[d];
        var dayNum = daysBetween(start, d) + 1;
        var cls = ["day-cell"];
        if (d === today) cls.push("today");
        if (d > today) cls.push("future");
        if (e) cls.push(e.status); else cls.push("empty");
        var statusBadge = e ? (e.status === "published" ? "✅" : e.status === "skipped" ? "✕" : e.status === "planned" ? "◻" : "✂️") : "";
        return '<div class="' + cls.join(" ") + '" data-day="' + d + '">' +
          '<div class="d-date"><span>Day ' + dayNum + '</span><span>' + weekdayShort(d) + " " + fmtDateShort(d) + '</span></div>' +
          '<div class="d-title">' + (e && e.title ? esc(e.title) : (e && e.idea ? esc(e.idea) : "—")) + '</div>' +
          '<div class="row between" style="margin-top:auto"><span class="muted" style="font-size:11px">' + (e ? esc(e.status) : "") + '</span><span>' + statusBadge + '</span></div>' +
        '</div>';
      }).join("") +
      '</div>' +

      '<h2 class="section-title">Learnings Log</h2>' +
      (withLearnings.length === 0
        ? '<div class="empty-note">No learnings logged yet. Every film teaches something — write it down.</div>'
        : '<div class="card">' + withLearnings.slice(0, 30).map(function (e) {
            return '<div class="milestone-row">' +
              '<span class="m-date">' + fmtDateShort(e.date) + '</span>' +
              '<span class="m-title"><strong>' + esc(e.title || "Untitled") + ':</strong> ' + esc(e.learnings) + '</span></div>';
          }).join("") + "</div>");

    $$(".day-cell", root).forEach(function (cell) {
      cell.onclick = function () { editDayModal(cell.getAttribute("data-day")); };
    });
  }

  return { render: render };
})();

</script>
<script>
/* ============ festivals.js — festival database, roadmap, deadline calendar ============ */
"use strict";

var FestivalsView = (function () {

  var PLAN_STATUSES = ["not planned", "researching", "planned", "film ready", "submitted", "accepted", "rejected", "won"];

  function planFor(fid) {
    return Store.get().festivalPlans[fid] || { status: "not planned", filmTitle: "", notes: "" };
  }

  function allDeadlines() {
    var rows = [];
    Store.festivals().forEach(function (f) {
      (f.deadlines || []).forEach(function (d) {
        if (d.date) rows.push({ festival: f, deadline: d });
      });
    });
    rows.sort(function (a, b) { return a.deadline.date < b.deadline.date ? -1 : 1; });
    return rows;
  }

  function planModal(fid) {
    var f = Store.festivals().find(function (x) { return x.id === fid; });
    if (!f) return;
    var p = planFor(fid);
    var html =
      '<h3>' + esc(f.name) + '</h3>' +
      '<p class="muted mb" style="font-size:13px">' + esc(f.strategyNotes || "") + '</p>' +
      '<label class="field"><span>Submission status</span><select id="p-status">' +
      PLAN_STATUSES.map(function (st) {
        return '<option value="' + st + '"' + (p.status === st ? " selected" : "") + '>' + st + '</option>';
      }).join("") + '</select></label>' +
      '<label class="field"><span>Film to submit</span><input id="p-film" value="' + esc(p.filmTitle) + '" placeholder="Which short goes here?"></label>' +
      '<label class="field"><span>Notes</span><textarea id="p-notes">' + esc(p.notes) + '</textarea></label>' +
      '<div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="primary" id="p-save">Save</button></div>';
    openModal(html);
    $("#p-save").onclick = function () {
      Store.get().festivalPlans[fid] = {
        status: $("#p-status").value,
        filmTitle: $("#p-film").value.trim(),
        notes: $("#p-notes").value.trim(),
        updatedAt: new Date().toISOString()
      };
      Store.save(); closeModal(); toast("Plan saved"); App.render();
    };
  }

  function downloadICS() {
    var today = todayISO();
    var events = allDeadlines().filter(function (r) { return r.deadline.date >= today; });
    if (events.length === 0) { toast("No upcoming deadlines", true); return; }
    var lines = [
      "BEGIN:VCALENDAR", "VERSION:2.0",
      "PRODID:-//Kollektiv Oskar//Way To Oscar Command Center//EN",
      "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
      "X-WR-CALNAME:Festival Deadlines — Way to Oscar"
    ];
    var stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
    events.forEach(function (r) {
      var d = r.deadline.date.replace(/-/g, "");
      var next = addDays(r.deadline.date, 1).replace(/-/g, "");
      var summary = "🎬 " + r.festival.name + " — " + r.deadline.type + " deadline" + (r.deadline.estimated ? " (est.)" : "");
      var desc = (r.festival.oscarQualifying ? "Oscar-qualifying. " : "") +
        (r.deadline.feeAmount != null ? "Fee: " + r.deadline.feeAmount + " " + (r.deadline.feeCurrency || "") + ". " : "") +
        (r.festival.maxRuntimeMin ? "Max runtime: " + r.festival.maxRuntimeMin + " min. " : "") +
        (r.festival.premiereRequirement ? "Premiere: " + r.festival.premiereRequirement + ". " : "") +
        (r.deadline.estimated ? "DATE IS ESTIMATED — verify on the festival site! " : "") +
        (r.festival.url || "");
      lines.push(
        "BEGIN:VEVENT",
        "UID:" + r.festival.id + "-" + r.deadline.type + "-" + d + "@waytooscar",
        "DTSTAMP:" + stamp,
        "DTSTART;VALUE=DATE:" + d,
        "DTEND;VALUE=DATE:" + next,
        "SUMMARY:" + summary.replace(/[\n,;]/g, " "),
        "DESCRIPTION:" + desc.replace(/[\n]/g, " ").replace(/([,;])/g, "\\$1"),
        "BEGIN:VALARM", "TRIGGER:-P14D", "ACTION:DISPLAY",
        "DESCRIPTION:Festival deadline in 2 weeks", "END:VALARM",
        "END:VEVENT"
      );
    });
    lines.push("END:VCALENDAR");
    var blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "festival-deadlines.ics";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast(events.length + " deadlines exported — import into Google/Apple Calendar");
  }

  function statusBadge(status) {
    var cls = { "submitted": "blue", "accepted": "teal", "won": "gold", "rejected": "red", "planned": "blue", "film ready": "teal", "researching": "gray" }[status] || "gray";
    return status === "not planned" ? "" : '<span class="badge ' + cls + '">' + esc(status) + '</span>';
  }

  function render(root) {
    var fests = Store.festivals();
    var rules = Store.academyRules();
    var today = todayISO();
    var filter = render._filter || "all";

    var visible = fests.filter(function (f) {
      if (filter === "qualifying") return f.oscarQualifying;
      if (filter === "tier1") return f.tier === 1;
      if (filter === "planned") return planFor(f.id).status !== "not planned";
      return true;
    }).slice().sort(function (a, b) { return (a.tier || 9) - (b.tier || 9) || (a.name < b.name ? -1 : 1); });

    var upcoming = allDeadlines().filter(function (r) { return r.deadline.date >= today; });

    root.innerHTML =
      '<h1 class="view-title">Festival Roadmap</h1>' +
      '<p class="view-sub">Oscar-qualifying festivals for 2026/2027 submissions. Researched July 2026 — dates marked "est." must be re-verified ~3 months before the deadline.</p>' +

      (rules ?
        '<div class="card accent-gold mb">' +
        '<span class="stat-label">🏛 Academy qualification rules (shorts)</span>' +
        '<div class="mt" style="font-size:13.5px">' +
        '<strong>Runtime:</strong> max ' + (rules.runtimeLimitMinutes || 40) + ' min incl. credits · ' +
        '<strong>Paths:</strong> ' + (rules.qualificationPaths || []).map(esc).join(" · ") +
        (rules.eligibilityNotes ? '<div class="muted mt" style="font-size:12.5px">' + esc(rules.eligibilityNotes) + '</div>' : "") +
        '</div></div>' : "") +

      (function () {
        var st = window.SEED && window.SEED.strategy;
        if (!st || !st.festivalRoadmap) return "";
        return '<div class="card accent-red mb"><span class="stat-label">🎯 2027 Submission Strategy</span>' +
          '<ul class="mt" style="padding-left:20px;font-size:13px;line-height:1.75">' +
          st.festivalRoadmap.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") +
          '</ul></div>';
      })() +

      '<h2 class="section-title">Deadline Calendar</h2>' +
      '<div class="row mb"><button class="blue" id="btn-ics">📅 Export deadlines (.ics)</button>' +
      '<span class="muted" style="font-size:12px">Import into Google/Apple Calendar — includes a 2-week reminder per deadline</span></div>' +
      '<div class="card">' +
      (upcoming.length === 0 ? '<div class="empty-note">No upcoming deadlines in the database.</div>' :
        '<div class="timeline mt">' +
        upcoming.slice(0, 18).map(function (r) {
          var days = daysBetween(today, r.deadline.date);
          return '<div class="timeline-item ' + (days <= 21 ? "urgent" : "") + '">' +
            '<div class="tl-date">' + fmtDate(r.deadline.date) + ' · in ' + days + ' days' + (r.deadline.estimated ? ' <span class="badge">est.</span>' : "") + '</div>' +
            '<div class="tl-title clickable" data-fest="' + esc(r.festival.id) + '">' + esc(r.festival.name) + ' — ' + esc(r.deadline.type) + ' deadline</div>' +
            '<div class="tl-meta">' +
            (r.deadline.feeAmount != null ? "Fee " + r.deadline.feeAmount + " " + esc(r.deadline.feeCurrency || "") + " · " : "") +
            (r.festival.oscarQualifying ? "Oscar-qualifying" : "not qualifying") +
            (r.festival.maxRuntimeMin ? " · max " + r.festival.maxRuntimeMin + " min" : "") +
            ' · ' + statusBadge(planFor(r.festival.id).status) +
            '</div></div>';
        }).join("") + "</div>") +
      '</div>' +

      '<h2 class="section-title">Festival Database</h2>' +
      '<div class="filter-bar">' +
        '<select id="fest-filter">' +
        '<option value="all"' + (filter === "all" ? " selected" : "") + '>All festivals (' + fests.length + ')</option>' +
        '<option value="qualifying"' + (filter === "qualifying" ? " selected" : "") + '>Oscar-qualifying only</option>' +
        '<option value="tier1"' + (filter === "tier1" ? " selected" : "") + '>Tier 1 (top prestige)</option>' +
        '<option value="planned"' + (filter === "planned" ? " selected" : "") + '>My submissions</option>' +
        '</select><span class="muted" style="font-size:12px">Click a row to plan your submission</span></div>' +

      '<div class="table-wrap"><table><thead><tr>' +
      '<th>Festival</th><th>Tier</th><th>Oscar</th><th>Next deadline</th><th>Fee</th><th>Max len</th><th>Premiere req.</th><th>My status</th>' +
      '</tr></thead><tbody>' +
      visible.map(function (f) {
        var next = (f.deadlines || []).filter(function (d) { return d.date >= today; })
          .sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0];
        var p = planFor(f.id);
        return '<tr class="clickable" data-fest="' + esc(f.id) + '">' +
          '<td><strong>' + esc(f.name) + '</strong><br><span class="muted">' + esc(f.city || "") + ', ' + esc(f.country || "") +
          (f.url ? ' · <a href="' + esc(f.url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">site ↗</a>' : "") + '</span>' +
          (f.strategyNotes ? '<br><span class="muted" style="font-size:12px">' + esc(f.strategyNotes) + '</span>' : "") + '</td>' +
          '<td><span class="badge ' + (f.tier === 1 ? "gold" : f.tier === 2 ? "blue" : "gray") + '">T' + (f.tier || "?") + '</span></td>' +
          '<td>' + (f.oscarQualifying
            ? '<span class="badge gold">YES</span><br><span class="muted" style="font-size:10.5px">' + (f.qualifyingCategories || []).join(", ") + '</span>'
            : '<span class="badge">no</span>') + '</td>' +
          '<td>' + (next ? '<span class="mono">' + fmtDate(next.date) + '</span> <span class="muted">(' + esc(next.type) + ')</span>' + (next.estimated ? ' <span class="badge">est.</span>' : "") : '<span class="muted">TBA</span>') + '</td>' +
          '<td>' + (next && next.feeAmount != null ? next.feeAmount + " " + esc(next.feeCurrency || "") : "—") + '</td>' +
          '<td>' + (f.maxRuntimeMin ? f.maxRuntimeMin + "′" : "—") + '</td>' +
          '<td style="max-width:180px"><span class="muted" style="font-size:12px">' + esc(f.premiereRequirement || "—") + '</span></td>' +
          '<td>' + (statusBadge(p.status) || '<span class="muted">—</span>') + (p.filmTitle ? '<br><span class="muted" style="font-size:11.5px">🎬 ' + esc(p.filmTitle) + '</span>' : "") + '</td>' +
        '</tr>';
      }).join("") +
      '</tbody></table></div>';

    $("#btn-ics").onclick = downloadICS;
    $("#fest-filter").onchange = function () {
      render._filter = this.value;
      App.render();
    };
    $$("[data-fest]", root).forEach(function (n) {
      n.onclick = function () { planModal(n.getAttribute("data-fest")); };
    });
  }

  return { render: render };
})();

</script>
<script>
/* ============ ideas.js — idea vault (Notion import + new) ============ */
"use strict";

var IdeasView = (function () {

  var STATUSES = ["Neu", "In Arbeit", "Umgesetzt", "Archiviert"];

  function categories() {
    var set = {};
    Store.get().ideas.forEach(function (i) {
      (i.categories || []).forEach(function (c) { set[c] = true; });
    });
    return Object.keys(set).sort();
  }

  function editModal(id) {
    var s = Store.get();
    var idea = id ? s.ideas.find(function (x) { return x.id === id; }) : null;
    var v = idea || { title: "", categories: [], status: "Neu", energy: null, notes: "" };
    var html =
      '<h3>' + (idea ? "Edit idea" : "New idea") + '</h3>' +
      '<label class="field"><span>Idea</span><input id="i-title" value="' + esc(v.title) + '" placeholder="The idea in one line"></label>' +
      '<label class="field"><span>Categories (comma-separated)</span><input id="i-cats" value="' + esc((v.categories || []).join(", ")) + '" placeholder="Film, YouTube, ..."></label>' +
      '<div class="row">' +
      '<label class="field" style="flex:1"><span>Status</span><select id="i-status">' +
      STATUSES.map(function (st) { return '<option' + (v.status === st ? " selected" : "") + '>' + st + '</option>'; }).join("") +
      '</select></label>' +
      '<label class="field" style="flex:1"><span>Energy</span><select id="i-energy">' +
      ['', '🔥 Hoch', '⚡ Mittel', '💤 Niedrig'].map(function (e) {
        return '<option value="' + e + '"' + ((v.energy || "") === e ? " selected" : "") + '>' + (e || "—") + '</option>';
      }).join("") + '</select></label></div>' +
      '<label class="field"><span>Notes</span><textarea id="i-notes" style="min-height:110px">' + esc(v.notes) + '</textarea></label>' +
      '<div class="modal-actions">' +
      (idea ? '<button class="ghost danger" id="i-delete">Delete</button>' : "") +
      (idea ? '<button class="teal" id="i-to-challenge" title="Copy this idea onto the next free challenge day">🎬 → Challenge day</button>' : "") +
      '<button class="ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="primary" id="i-save">Save</button></div>';
    openModal(html);
    var toChallenge = $("#i-to-challenge");
    if (toChallenge) toChallenge.onclick = function () {
      var st = Store.get();
      var d = st.settings.challengeStart > todayISO() ? st.settings.challengeStart : todayISO();
      var guard = 0;
      while (st.challengeDays[d] && (st.challengeDays[d].title || st.challengeDays[d].idea) && guard++ < 400) d = addDays(d, 1);
      st.challengeDays[d] = {
        date: d, title: idea.title.slice(0, 60), idea: idea.title + (idea.notes ? "\n\n" + idea.notes : ""),
        status: "planned", link: "", learnings: "",
        updatedAt: new Date().toISOString()
      };
      if (idea.status === "Neu") { idea.status = "In Arbeit"; idea.updatedAt = new Date().toISOString(); }
      Store.save(); closeModal();
      toast("Planned for " + fmtDate(d) + " (Day " + (daysBetween(st.settings.challengeStart, d) + 1) + ")");
      App.render();
    };
    $("#i-save").onclick = function () {
      var title = $("#i-title").value.trim();
      if (!title) { toast("Idea text required", true); return; }
      var cats = $("#i-cats").value.split(",").map(function (c) { return c.trim(); }).filter(Boolean);
      var now = new Date().toISOString();
      if (idea) {
        idea.title = title; idea.categories = cats;
        idea.status = $("#i-status").value; idea.energy = $("#i-energy").value || null;
        idea.notes = $("#i-notes").value.trim(); idea.updatedAt = now;
      } else {
        s.ideas.unshift({
          id: uid("idea"), title: title, categories: cats,
          status: $("#i-status").value, energy: $("#i-energy").value || null,
          notes: $("#i-notes").value.trim(), source: "app",
          createdAt: now, updatedAt: now
        });
      }
      Store.save(); closeModal(); toast("Idea saved"); App.render();
    };
    var del = $("#i-delete");
    if (del) del.onclick = function () {
      s.ideas = s.ideas.filter(function (x) { return x.id !== id; });
      Store.save(); closeModal(); toast("Idea deleted"); App.render();
    };
  }

  function render(root) {
    var s = Store.get();
    var q = (render._q || "").toLowerCase();
    var cat = render._cat || "all";
    var status = render._status || "all";

    var visible = s.ideas.filter(function (i) {
      if (q && (i.title + " " + i.notes).toLowerCase().indexOf(q) === -1) return false;
      if (cat !== "all" && (i.categories || []).indexOf(cat) === -1) return false;
      if (status !== "all" && i.status !== status) return false;
      return true;
    });

    root.innerHTML =
      '<h1 class="view-title">Ideas Vault</h1>' +
      '<p class="view-sub">' + s.ideas.length + ' ideas — imported from your Notion Second Brain + Ideen-Schrank, extendable here. Original German kept as written.</p>' +

      '<div class="filter-bar">' +
        '<input id="idea-q" placeholder="Search ideas..." value="' + esc(render._q || "") + '" style="flex:1;min-width:180px">' +
        '<select id="idea-cat"><option value="all">All categories</option>' +
        categories().map(function (c) { return '<option' + (cat === c ? " selected" : "") + '>' + esc(c) + '</option>'; }).join("") + '</select>' +
        '<select id="idea-status"><option value="all">All statuses</option>' +
        STATUSES.map(function (st) { return '<option' + (status === st ? " selected" : "") + '>' + st + '</option>'; }).join("") + '</select>' +
        '<button class="primary" id="idea-new">+ New idea</button>' +
      '</div>' +

      '<div class="grid cols-3">' +
      visible.slice(0, 120).map(function (i) {
        return '<div class="card clickable" data-idea="' + esc(i.id) + '">' +
          '<div class="row between mb" style="gap:6px">' +
          '<span>' + (i.categories || []).slice(0, 3).map(function (c) { return '<span class="badge blue">' + esc(c) + '</span> '; }).join("") + '</span>' +
          '<span class="badge ' + (i.status === "Umgesetzt" ? "teal" : i.status === "In Arbeit" ? "gold" : i.status === "Archiviert" ? "gray" : "red") + '">' + esc(i.status) + '</span></div>' +
          '<div style="font-weight:600;font-size:14.5px;line-height:1.35">' + esc(i.title) + '</div>' +
          (i.notes ? '<div class="muted mt" style="font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">' + esc(i.notes) + '</div>' : "") +
          '<div class="row between mt"><span class="muted" style="font-size:11px">' + (i.energy ? esc(i.energy) : "") + '</span>' +
          '<span class="muted" style="font-size:11px">' + esc(i.source || "") + '</span></div>' +
        '</div>';
      }).join("") +
      '</div>' +
      (visible.length === 0 ? '<div class="empty-note">No ideas match the filter.</div>' : "") +
      (visible.length > 120 ? '<div class="empty-note">Showing first 120 of ' + visible.length + ' — refine the search.</div>' : "");

    $("#idea-q").oninput = function () { render._q = this.value; App.render(); setTimeout(function(){ var n=$("#idea-q"); if(n){n.focus(); n.setSelectionRange(n.value.length,n.value.length);} },0); };
    $("#idea-cat").onchange = function () { render._cat = this.value; App.render(); };
    $("#idea-status").onchange = function () { render._status = this.value; App.render(); };
    $("#idea-new").onclick = function () { editModal(null); };
    $$("[data-idea]", root).forEach(function (n) {
      n.onclick = function () { editModal(n.getAttribute("data-idea")); };
    });
  }

  return { render: render };
})();

</script>
<script>

      '</select></label>' +
      '<label class="field" style="flex:1"><span>Status</span><select id="p-status">' +
      STATUSES.map(function (st) { return '<option' + (v.status === st ? " selected" : "") + '>' + st + '</option>'; }).join("") +
      '</select></label></div>' +
      '<div class="row">' +
      '<label class="field" style="flex:1"><span>Owner</span><select id="p-owner">' +
      ["Robin", "Simon", "Jasmin", "Team"].map(function (o) { return '<option' + (v.owner === o ? " selected" : "") + '>' + o + '</option>'; }).join("") +
      '</select></label>' +
      '<label class="field" style="flex:1"><span>Target date</span><input type="date" id="p-date" value="' + esc(v.targetDate || "") + '"></label></div>' +
      '<label class="field"><span>Link</span><input id="p-link" value="' + esc(v.link || "") + '" placeholder="https://..."></label>' +
      '<label class="field"><span>Notes</span><textarea id="p-notes">' + esc(v.notes || "") + '</textarea></label>' +
      '<div class="modal-actions">' +
      (p ? '<button class="ghost danger" id="p-delete">Delete</button>' : "") +
      '<button class="ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="primary" id="p-save">Save</button></div>';
    openModal(html);
    $("#p-save").onclick = function () {
      var title = $("#p-title").value.trim();
      if (!title) { toast("Title required", true); return; }
      var now = new Date().toISOString();
      if (p) {
        p.title = title; p.type = $("#p-type").value; p.status = $("#p-status").value;
        p.owner = $("#p-owner").value; p.targetDate = $("#p-date").value || null;
        p.link = $("#p-link").value.trim(); p.notes = $("#p-notes").value.trim(); p.updatedAt = now;
      } else {
        s.projects.unshift({
          id: uid("prj"), title: title, type: $("#p-type").value, status: $("#p-status").value,
          owner: $("#p-owner").value, targetDate: $("#p-date").value || null,
          link: $("#p-link").value.trim(), notes: $("#p-notes").value.trim(),
          createdAt: now, updatedAt: now
        });
      }
      Store.save(); closeModal(); toast("Project saved"); App.render();
    };
    var del = $("#p-delete");
    if (del) del.onclick = function () {
      s.projects = s.projects.filter(function (x) { return x.id !== id; });
      Store.save(); closeModal(); toast("Project deleted"); App.render();
    };
  }

  function render(root) {
    var s = Store.get();
    var typeFilter = render._type || "all";
    var visible = s.projects.filter(function (p) {
      return typeFilter === "all" || p.type === typeFilter;
    });
    var counts = {};
    s.projects.forEach(function (p) { counts[p.type] = (counts[p.type] || 0) + 1; });

    root.innerHTML =
      '<h1 class="view-title">Projects</h1>' +
      '<p class="view-sub">Everything in production across Kollektiv Oskar — short films, features, reels and YouTube episodes. Imported from your Notion pipelines.</p>' +

      '<div class="grid cols-4 mb">' +
      TYPES.slice(0, 4).map(function (t) {
        return '<div class="card"><span class="stat-label">' + t.label + '</span><div class="stat-value">' + (counts[t.key] || 0) + '</div></div>';
      }).join("") +
      '</div>' +

      '<div class="filter-bar">' +
        '<select id="prj-type"><option value="all">All types (' + s.projects.length + ')</option>' +
        TYPES.map(function (t) { return '<option value="' + t.key + '"' + (typeFilter === t.key ? " selected" : "") + '>' + t.label + '</option>'; }).join("") +
        '</select>' +
        '<button class="primary" id="prj-new">+ New project</button>' +
      '</div>' +

      '<div class="table-wrap"><table><thead><tr><th>Project</th><th>Type</th><th>Status</th><th>Owner</th><th>Target</th><th>Notes</th></tr></thead><tbody>' +
      visible.slice(0, 200).map(function (p) {
        var stCls = p.status === "published" ? "teal" : (p.status === "editing" || p.status === "shooting") ? "blue" : p.status === "archived" ? "gray" : "red";
        return '<tr class="clickable" data-prj="' + esc(p.id) + '">' +
          '<td><strong>' + esc(p.title) + '</strong>' +
          (p.link ? ' <a href="' + esc(p.link) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗</a>' : "") + '</td>' +
          '<td>' + typeLabel(p.type) + '</td>' +
          '<td><span class="badge ' + stCls + '">' + esc(p.status) + '</span></td>' +
          '<td>' + esc(p.owner || "—") + '</td>' +
          '<td class="mono" style="font-size:12px">' + (p.targetDate ? fmtDate(p.targetDate) : "—") + '</td>' +
          '<td style="max-width:260px"><span class="muted" style="font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + esc(p.notes || "") + '</span></td>' +
        '</tr>';
      }).join("") +
      '</tbody></table></div>' +
      (visible.length === 0 ? '<div class="empty-note">No projects of this type yet.</div>' : "");

    $("#prj-type").onchange = function () { render._type = this.value; App.render(); };
    $("#prj-new").onclick = function () { editModal(null); };
    $$("[data-prj]", root).forEach(function (n) {
      n.onclick = function () { editModal(n.getAttribute("data-prj")); };
    });
  }

  return { render: render };
})();

</script>
<script>
/* ============ settings.js — data export/import (Dropbox workflow) + settings ============ */
"use strict";

var SettingsView = (function () {

  function doExport() {
    var snap = Store.exportSnapshot();
    var name = "way-to-oscar-data-" + todayISO() + ".json";
    downloadJSON(snap, name);
    toast("Exported " + name + " — drop it in the team Dropbox");
  }

  function doImport(mode) {
    pickJSONFile(function (err, obj, filename) {
      if (err) { toast("Could not read file: " + err.message, true); return; }
      try {
        if (mode === "merge") Store.importMerge(obj);
        else Store.importReplace(obj);
        toast((mode === "merge" ? "Merged " : "Imported ") + filename);
        App.render();
      } catch (e) {
        toast(e.message, true);
      }
    });
  }

  function render(root) {
    var s = Store.get();
    var stats = {
      ideas: s.ideas.length,
      projects: s.projects.length,
      days: Object.keys(s.challengeDays).length,
      followers: s.followers.length,
      milestones: s.milestones.length,
      plans: Object.keys(s.festivalPlans).length
    };

    root.innerHTML =
      '<h1 class="view-title">Data &amp; Settings</h1>' +
      '<p class="view-sub">Your data lives in this browser (autosaved). Use Export/Import to share via the team Dropbox with Simon &amp; Jasmin.</p>' +

      '<h2 class="section-title">Team Sharing (Dropbox workflow)</h2>' +
      '<div class="grid cols-2">' +
        '<div class="card accent-teal">' +
          '<span class="stat-label">📤 Export</span>' +
          '<p class="mt" style="font-size:13.5px">Download a full snapshot (<span class="mono">way-to-oscar-data-YYYY-MM-DD.json</span>) and put it in the team Dropbox folder.</p>' +
          '<div class="mt"><button class="teal" id="btn-export">Export data file</button></div>' +
        '</div>' +
        '<div class="card accent-blue">' +
          '<span class="stat-label">📥 Import</span>' +
          '<p class="mt" style="font-size:13.5px"><strong>Replace</strong> takes the file as the new truth. <strong>Merge</strong> combines the file with your local data (newer edit wins per item) — use this when two people worked in parallel.</p>' +
          '<div class="mt row"><button class="blue" id="btn-import-replace">Import (replace)</button>' +
          '<button id="btn-import-merge">Import (merge)</button></div>' +
        '</div>' +
      '</div>' +

      '<div class="card mt">' +
        '<span class="stat-label">Current data</span>' +
        '<div class="row mt" style="gap:18px;font-size:13px">' +
        '<span>💡 ' + stats.ideas + ' ideas</span><span>🎬 ' + stats.projects + ' projects</span>' +
        '<span>📆 ' + stats.days + ' challenge days</span><span>📈 ' + stats.followers + ' follower points</span>' +
        '<span>🚩 ' + stats.milestones + ' milestones</span><span>🎪 ' + stats.plans + ' festival plans</span></div>' +
        '<div class="muted mt" style="font-size:12px">Last change: ' + esc(s.meta.updatedAt || "—") + '</div>' +
      '</div>' +

      '<h2 class="section-title">Settings</h2>' +
      '<div class="card" style="max-width:560px">' +
        '<label class="field"><span>Your name (stamped on exports)</span><input id="s-name" value="' + esc(s.settings.userName) + '"></label>' +
        '<label class="field"><span>Oscar ceremony target date</span><input type="date" id="s-oscar" value="' + esc(s.settings.oscarCeremonyDate) + '"></label>' +
        '<label class="field"><span>Countdown label</span><input id="s-oscar-label" value="' + esc(s.settings.oscarCeremonyLabel) + '"></label>' +
        '<label class="field"><span>Challenge start date</span><input type="date" id="s-challenge" value="' + esc(s.settings.challengeStart) + '"></label>' +
        '<div class="row">' +
        '<label class="field" style="flex:1"><span>Follower goal</span><input type="number" id="s-goal" value="' + esc(s.settings.followerGoal) + '"></label>' +
        '<label class="field" style="flex:1"><span>Goal date</span><input type="date" id="s-goal-date" value="' + esc(s.settings.followerGoalDate) + '"></label></div>' +
        '<button class="primary" id="s-save">Save settings</button>' +
      '</div>' +

      '<h2 class="section-title">Danger Zone</h2>' +
      '<div class="card" style="max-width:560px">' +
        '<p class="muted" style="font-size:13px">Reset wipes all local edits and restores the original Notion/festival seed data. Export first if unsure.</p>' +
        '<div class="mt"><button class="danger" id="s-reset">Reset to seed data</button></div>' +
      '</div>';

    $("#btn-export").onclick = doExport;
    $("#btn-import-replace").onclick = function () { doImport("replace"); };
    $("#btn-import-merge").onclick = function () { doImport("merge"); };
    $("#s-save").onclick = function () {
      var st = Store.get().settings;
      st.userName = $("#s-name").value.trim() || "Robin";
      st.oscarCeremonyDate = $("#s-oscar").value || st.oscarCeremonyDate;
      st.oscarCeremonyLabel = $("#s-oscar-label").value.trim();
      st.challengeStart = $("#s-challenge").value || st.challengeStart;
      st.followerGoal = parseInt($("#s-goal").value, 10) || 1000000;
      st.followerGoalDate = $("#s-goal-date").value || st.followerGoalDate;
      Store.save(); toast("Settings saved"); App.render();
    };
    $("#s-reset").onclick = function () {
      openModal(
        '<h3>Reset all data?</h3><p style="font-size:14px">This deletes every local edit (challenge log, followers, plans...) and restores the seed. This cannot be undone.</p>' +
        '<div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancel</button>' +
        '<button class="primary" id="confirm-reset">Yes, reset everything</button></div>');
      $("#confirm-reset").onclick = function () {
        Store.resetToSeed(); closeModal(); toast("Reset to seed data"); App.render();
      };
    };
  }

  return { render: render };
})();

</script>
<script>
/* ============ app.js — hash router ============ */
"use strict";

var App = (function () {
  var routes = {
    dashboard: DashboardView,
    challenge: ChallengeView,
    festivals: FestivalsView,
    ideas: IdeasView,
    projects: ProjectsView,
    settings: SettingsView
  };

  function currentRoute() {
    var h = (location.hash || "#/dashboard").replace(/^#\//, "");
    return routes[h] ? h : "dashboard";
  }

  function render() {
    var route = currentRoute();
    $$("#main-nav a").forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("data-route") === route);
    });
    var root = $("#view");
    routes[route].render(root);
    var s = Store.get();
    $("#footer-status").textContent =
      "Data: " + s.ideas.length + " ideas · " + Object.keys(s.challengeDays).length + " challenge days · saved locally " +
      (s.meta.updatedAt ? "· last edit " + s.meta.updatedAt.slice(0, 16).replace("T", " ") : "");
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", render);

  return { render: render };
})();

</script>
</body>
</html>
